<?xml version="1.0" encoding="UTF-8"?>
<!--
  Northvale Roofing — primary horizontal wordmark (for LIGHT backgrounds).
  House-outline glyph with a plumb-line crosshair (gold vertical accent), next
  to the "NORTHVALE" wordmark and a "ROOFING · NW HOUSTON" tagline.

  Notes:
    - Transparent background (no filled <rect>) so it composites on any surface.
      Use logo-light.svg on dark backgrounds (see the footer).
    - viewBox is cropped to the artwork's vertical extent so it renders large at
      a given CSS height; do NOT set width/height here — size it in CSS
      (h-* w-auto) so it scales without distortion.
    - Wordmark uses system serif/sans (Georgia/Arial) so it renders identically
      across devices without loading a web font inside the <img>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 760 164"
     role="img" aria-label="Northvale Roofing"
     preserveAspectRatio="xMidYMid meet">
  <!-- Icon: house outline with plumb-line crosshair -->
  <g transform="translate(34,20)">
    <path d="M8 60 L62 12 L116 60 V150 H8 Z" fill="none" stroke="#172f52" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="24" y1="92" x2="100" y2="92" stroke="#98a1ac" stroke-width="4" stroke-linecap="round"/>
    <line x1="62" y1="48" x2="62" y2="136" stroke="#e09a3c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="196" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#172f52" letter-spacing="3">NORTHVALE</text>
  <text x="200" y="152" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#77808d" letter-spacing="7">ROOFING &#183; NW HOUSTON</text>
</svg>
